name: Publish site (main)

# Läuft nur, wenn es einen neuen Commit auf main gibt (oder von Hand): veröffentlicht die normale Seite.
# Die Testseite unter /dev/ wird dabei mit dem aktuellen Stand von dev mitveröffentlicht (siehe deploy-site.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/deploy-site.yml
