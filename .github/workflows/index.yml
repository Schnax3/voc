name: Update lesson index

# Erzeugt index.json (Liste aller Lektionen) neu, wenn Vokabel-JSONs, titles.json oder das Skript geändert werden,
# zum Beispiel wenn du eine Lektion von Hand hinzufügst, umbenennst oder löschst.
on:
  push:
    paths:
      - '**/*.json'
      - '!index.json'
      - scripts/build_index.py
      - .github/workflows/index.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Build lesson index
        run: python scripts/build_index.py

      - name: Commit index.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json ist aktuell."
            exit 0
          fi
          git commit -m "Update lesson index"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          if [ "$GITHUB_REF_NAME" = "main" ]; then pages=pages.yml; else pages=pages-dev.yml; fi
          gh workflow run "$pages" --ref "$GITHUB_REF_NAME" || echo "Pages-Workflow $pages nicht gestartet (existiert er auf diesem Branch?)"
