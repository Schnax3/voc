name: Import vocabulary pages

on:
  push:
    paths:
      - sources.csv
      - scripts/import_vocabulary.py
      - scripts/build_index.py
      - tests/**
      - .github/workflows/import-vocabulary.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Import und Index-Workflow schreiben beide in den Branch: nie gleichzeitig.
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Import vocabulary pages
        run: python scripts/import_vocabulary.py

      - name: Build lesson index
        run: python scripts/build_index.py

      - name: Commit imported JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No imported files changed."
            exit 0
          fi
          git commit -m "Import vocabulary pages"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
          # Pushes mit dem Workflow-Token lösen keine anderen Workflows aus: Seite bei Bedarf selbst neu veröffentlichen.
          gh workflow run pages.yml --ref "$GITHUB_REF_NAME" || echo "Pages-Workflow nicht gestartet (existiert er auf diesem Branch?)"
