name: Deploy site (wiederverwendbar)

# Baut die Seite aus main (normale Seite) und dev (Testseite unter /dev/) und veröffentlicht sie.
# GitHub Pages kennt nur EINE Veröffentlichung pro Repository: jede Veröffentlichung muss deshalb
# beide Branches enthalten, sonst würde die jeweils andere Seite verschwinden.
# Aufgerufen von pages.yml (Push auf main) und pages-dev.yml (Push auf dev).
# Voraussetzung: Repository-Einstellungen -> Pages -> Source = "GitHub Actions".
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main (normale Seite)
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      - name: Check out dev (Testseite, falls der Branch existiert)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: dev
          path: site/dev

      # Pro Seite eine version.json (Commit + Zeit) und der Commit als Cache-Version im Service Worker.
      # So erkennt die App neue Versionen, und der Service Worker legt bei jeder Änderung einen frischen Cache an.
      - name: Stamp version
        run: |
          stamp() {
            dir="$1"
            [ -d "$dir/.git" ] || return 0
            sha="$(git -C "$dir" rev-parse --short=7 HEAD)"
            printf '{"version":"%s","built":"%s"}\n' "$sha" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$dir/version.json"
            sed -i "s/^const VERSION = '[^']*';/const VERSION = '$sha';/" "$dir/sw.js"
            echo "$dir: $sha"
          }
          stamp site
          stamp site/dev

      # Geschützter Link (z. B. Drive-Ordner der Klasse): wird mit dem Passwort verschlüsselt, nur der verschlüsselte Text kommt
      # auf die Seite (geheim.json). Secrets: DRIVE_LINK, DRIVE_PASSWORT; optional Variable (oder Secret) DRIVE_HINWEIS (Text hinter dem blauen Hinweis).
      # Fehlt ein Secret, gibt es keine geheim.json und die App zeigt den Bereich nicht an.
      - name: Encrypt protected link
        env:
          DRIVE_LINK: ${{ secrets.DRIVE_LINK }}
          DRIVE_PASSWORT: ${{ secrets.DRIVE_PASSWORT }}
          DRIVE_HINWEIS: ${{ vars.DRIVE_HINWEIS || secrets.DRIVE_HINWEIS }}
        run: |
          outputs=(site/geheim.json)
          [ -d site/dev ] && outputs+=(site/dev/geheim.json)
          # Das Skript liegt im Checkout von dev (der neueren Version), sonst in main.
          script=site/dev/scripts/encrypt_link.cjs
          [ -f "$script" ] || script=site/scripts/encrypt_link.cjs
          if [ ! -f "$script" ]; then echo "encrypt_link.cjs nicht gefunden: keine geheim.json."; exit 0; fi
          node "$script" "${outputs[@]}"

      - name: Assemble site
        run: |
          rm -rf site/.git site/dev/.git
          touch site/.nojekyll
          echo "Seiten-Dateien:" && find site -maxdepth 2 -name index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
