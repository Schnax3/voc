name: Deploy site (wiederverwendbar)

# Baut die Seite aus main (normale Seite) und dev (Testseite unter /dev/) und veröffentlicht sie.
# GitHub Pages kennt nur EINE Veröffentlichung pro Repository: jede Veröffentlichung muss deshalb
# beide Branches enthalten, sonst würde die jeweils andere Seite verschwinden.
# Aufgerufen von pages.yml (Push auf main) und pages-dev.yml (Push auf dev).
# Voraussetzung: Repository-Einstellungen -> Pages -> Source = "GitHub Actions".
on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main (normale Seite)
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      - name: Check out dev (Testseite, falls der Branch existiert)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: dev
          path: site/dev

      - name: Assemble site
        run: |
          rm -rf site/.git site/dev/.git
          touch site/.nojekyll
          echo "Seiten-Dateien:" && find site -maxdepth 2 -name index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
